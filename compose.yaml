name: copro
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: copro
      POSTGRES_USER: copro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Compléter .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copro -d copro"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - document_data:/app/media
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Compléter .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,copro.ydoxide.fr}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://copro.ydoxide.fr}
      HTTPS_ONLY: ${HTTPS_ONLY:-0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Compléter .env}
      POSTGRES_HOST: db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Compléter .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  document_data:
