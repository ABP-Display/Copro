name: diacamma-syndic

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: syndic
      POSTGRES_USER: syndic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseigner POSTGRES_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syndic -d syndic"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: syndic
      POSTGRES_USER: syndic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseigner POSTGRES_PASSWORD dans .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Renseigner DJANGO_SECRET_KEY dans .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SYNDIC_ADMIN_PASSWORD: ${SYNDIC_ADMIN_PASSWORD:?Renseigner SYNDIC_ADMIN_PASSWORD dans .env}
    volumes:
      - syndic_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/web/index.html', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  postgres_data:
  syndic_data:
